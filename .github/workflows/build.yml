# Compiles the app and widget on every push to develop and work branches, so a change is
# known to build before it's tried on a Mac, and keeps pictures of the widget at each size
# (the "widget-previews" artifact).
name: Build

on:
  push:
    branches: [develop, "feature/**", "fix/**", "hotfix/**", "release/**"]
  pull_request:

jobs:
  build:
    runs-on: macos-26 # Xcode 26: Liquid Glass
    steps:
      - uses: actions/checkout@v5
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ShortcutDivan.xcodeproj -scheme ShortcutDivan -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build build
      - name: Widget previews
        run: |
          swiftc -parse-as-library -o preview scripts/preview/WidgetPreview.swift \
            Widget/Views.swift Widget/Paging.swift Shared/*.swift
          ./preview
      - uses: actions/upload-artifact@v5
        with:
          name: widget-previews
          path: previews/*.png
